# 이 카탈로그 버전의 정체와 계보.
#
# 옛 버전 디렉터리를 이미지에서 지우면 그 시기의 판정을 재현할 수 없다.
# deprecates 로 계보를 남기고, 기동 시 모든 버전을 검증한다.
version: 1
catalog_version: std-2026.2
effective_date: 2026-10-26
deprecates: [std-2026.1]
files:
  - glossary.yaml
  - locode.yaml
sources:
  - authority: UN/LOCODE
    note: 항구·지명. locode.yaml
  - authority: UN/ECE Rec 20
    note: 수량·용적 단위 코드
  - authority: UN/ECE Rec 21
    note: 포장 형태 코드(CT·PK·BX·BG·DR·PP). B/L 포장 수량 단위는 Rec 21 알파벳 코드를 쓴다. PCE 는 현행 목록에 없는 구코드라 PP 로 정렬한다
  - authority: Incoterms 2020
    note: 가격조건. 조건 코드만 쓴다(장소 병기 안 함). 구조화 e-B/L 데이터와 f3_rules/mt700.py 가 거래조건을 코드로만 담고 X010 이 L/C 코드와 동등 비교하므로, 장소를 붙이면 정상 서류를 하자로 잡는다
  - authority: ISBP 745
    note: 관행 문구
  - authority: ISO 6346
    note: 컨테이너 번호. 체크디지트는 알고리즘이므로 사전 항목은 선사 접두뿐
  - authority: DCSA · 업계 관행
    note: 운송서류 용어·인도 관련
  - authority: HS
    note: 품목 분류. 예시 코드만. 관세율표 미적재
