[project]
name = "smart-e-bl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "yang6408", email = "redblue6408@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "boto3>=1.35",
    "fastapi>=0.141.1",
    "httpx>=0.27",
    "psycopg[binary]>=3.3.4",
    "PyJWT[crypto]>=2.9,<3",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.52.1",
]

[project.optional-dependencies]
ml = ["xgboost==3.3.0", "scikit-learn>=1.5", "shap>=0.46",
      "pandas>=2.2", "numpy>=1.26", "pyarrow>=17", "joblib>=1.4", "matplotlib>=3.9",
      "pyyaml>=6.0", "google-genai>=1.0", "anthropic>=0.69"]

[project.scripts]
smart-ebl-worker = "smart_e_bl.worker.main:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
# `ai/` 가 AI 서비스·실험 트리 공통의 임포트 루트다 — F 모듈(`f1_intake`,
# `f2_terms`, `f3_rules`, `f3_model`, `f3_research`, `f4_report`, `f6_reality`)은
# 전부 최상위 이름으로 임포트한다. 저장소 루트에서 `pytest` 를 돌릴 때도 그
# 이름들이 잡히도록 여기 명시한다. (`cd ai && pytest` 는 `ai/pytest.ini` 가
# 같은 일을 한다.)
pythonpath = ["ai"]
asyncio_mode = "auto"
# smart_e_bl.db.async_engine는 임포트 시점에 한 번만 만들어지는 모듈 전역
# 커넥션 풀이다 — 테스트마다 새 이벤트 루프를 쓰면 이전 루프에 묶인 커넥션을
# 재사용하려다 "attached to a different loop" 에러가 난다. 세션 전체가
# 루프 하나를 공유하게 한다.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
