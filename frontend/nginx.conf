server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # vercel.json의 rewrites와 같은 역할: /어떤 경로든 index.html로 돌려줘야
    # 리액트 라우터(react-router-dom)가 화면 전환을 처리할 수 있습니다.
    location / {
        try_files $uri /index.html;
    }

    # 게이트웨이 프록시 — vite.config.ts의 dev 서버 프록시(/gw-api)와 같은 역할.
    # CORS 회피용으로 같은 출처(8080)에서 /gw-api/* 를 게이트웨이(api:8000)로 넘긴다.
    location /gw-api/ {
        # 서류 파일이 이 경로로 올라간다. nginx 기본 상한은 1MB라, 그대로 두면
        # 1MB 넘는 B/L 스캔본이 게이트웨이에 닿기도 전에 413으로 잘린다 —
        # 화면에는 "Fetch is aborted"처럼 서버 오류로 보이지 않는 모양으로 뜬다.
        # 게이트웨이 자신의 상한(_MAX_UPLOAD_BYTES = 30MB, document_byte_size_ck)과
        # 같은 값으로 맞춘다. 여기가 더 작으면 게이트웨이의 오류 메시지가
        # 사용자에게 도달하지 못하고, 더 크면 30MB 검사를 통과할 수 없는 요청을
        # 굳이 끝까지 받아 읽는다.
        client_max_body_size 30m;

        # 주소를 변수에 담아 넘기는 이유: proxy_pass에 호스트 이름을 그대로 쓰면
        # nginx가 "설정을 읽는 시점"에 이름을 풀고, 못 풀면
        # `host not found in upstream "api"` 로 **컨테이너 자체가 안 뜬다**.
        # /gw-api만 죽는 게 아니라 화면 전체가 안 나온다 — api 컨테이너가 아직
        # 없거나(프론트만 단독 실행) 재생성 중일 때 실제로 그렇게 됐다.
        # 변수로 넘기면 요청이 올 때마다 풀어서, api가 없으면 그 요청만 502가
        # 나고 나머지 화면은 정상으로 뜬다.
        resolver 127.0.0.11 valid=10s;  # 도커 내장 DNS 주소(고정값)
        set $gateway http://api:8000;

        # proxy_pass에 변수를 쓰면 접두어를 떼주는 동작(뒤의 `/`)이 없어지므로
        # rewrite로 직접 뗀다. `/gw-api/api/v1/x` → `/api/v1/x`.
        rewrite ^/gw-api/(.*)$ /$1 break;
        proxy_pass $gateway;
        proxy_set_header Host $host;
    }
}
